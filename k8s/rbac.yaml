
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-monitor
  namespace: travelo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-monitor-role
  namespace: travelo
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-monitor-binding
  namespace: travelo
subjects:
  - kind: ServiceAccount
    name: travelo-monitor
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-monitor-role
  apiGroup: rbac.authorization.k8s.io
