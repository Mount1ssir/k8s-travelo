apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: travelo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: travelo-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
